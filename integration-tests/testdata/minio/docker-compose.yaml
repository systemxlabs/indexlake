networks:
  minio_bridge:

services:
  minio:
    # MinIO no longer allows anonymous pulls from quay.io or Docker Hub.
    # Silo is a community-maintained fork that keeps the MinIO S3 API and
    # environment contract, and also bundles the mcli client.
    image: docker.io/pgsty/silo:latest
    # The image has no data volume and MinIO creates the backend directories
    # under /data, so run as root to keep the container filesystem writable.
    user: "0:0"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio
      - MINIO_DEFAULT_BUCKETS=indexlake
    hostname: indexlake.minio
    networks:
      minio_bridge:
    ports:
      - 9001:9001
      - 9000:9000
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  mc:
    depends_on:
      - minio
    # The Silo server image also ships the mcli client, so no second image is
    # needed. Its default entrypoint is overridden below.
    image: docker.io/pgsty/silo:latest
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    entrypoint: >
      /bin/sh -c " until (mcli alias set minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done; mcli rm -r --force minio/indexlake; mcli mb --ignore-existing minio/indexlake; mcli anonymous set public minio/indexlake; tail -f /dev/null "
    networks:
      minio_bridge:
